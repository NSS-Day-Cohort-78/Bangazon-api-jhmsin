<h1>Expensive Products Report</h1>
<p>Products priced at $1000 or more:</p>

<table>
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>${{ product.price }}</td>
            <td>{{ product.description }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No expensive products found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
